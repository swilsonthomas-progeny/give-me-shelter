name: Daily ledger update

on:
  schedule:
    - cron: "41 14 * * *"   # 14:41 UTC = 6:41am PST / 7:41am PDT
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  id-token: write   # lets the job prove its identity to the Claude API; no stored key

env:
  BRANCH: auto/daily-update

concurrency:
  group: ledger-update
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # If yesterday's update is still waiting for review, keep building on it so any
      # edits made in that pull request survive. Otherwise start fresh from main.
      - name: Start from the open review, if there is one
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pr=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          if [ -n "$pr" ]; then
            git fetch origin "$BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"
            if ! git merge --no-edit origin/main; then
              echo "::error::data.json was edited both on main and in pull request #$pr. Merge or close #$pr, then rerun."
              exit 1
            fi
          else
            git checkout -B "$BRANCH" origin/main
          fi

      - name: Search for changes and draft an update
        env:
          # IDs from the Claude Console's workload identity wizard. They are not secrets;
          # a repository variable with the same name overrides the value here.
          ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID || 'fdrl_015NHkzYuELqGrqbBjQPvh4p' }}
          ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID || 'cc98e5e5-910e-4bcf-a650-b71071c61a07' }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID || 'svac_01DXEyPEby4K5Z9SFQVgQB55' }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID || 'wrkspc_017SABmkHdFMi7Qzv5dAH89V' }}
          # Fallback: if this secret exists it's used instead of the IDs above.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/update.py

      - name: Open or update the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.base.outputs.pr }}
        run: |
          if [ -f CHANGES.md ]; then
            git add data.json
            git commit -m "Daily ledger update $(date -u +%F)"
          fi
          if [ -n "$PR" ]; then
            # Push today's changes (and anything merged from main) onto the open review.
            git push origin "$BRANCH"
            if [ -f CHANGES.md ]; then
              gh pr view "$PR" --json body --jq .body > previous.md
              { cat CHANGES.md; printf '\n\n---\n\n### Earlier in this review\n\n'; sed '/^### Earlier in this review$/d' previous.md; } | head -c 60000 > body.md
              gh pr edit "$PR" --body-file body.md
            fi
          elif [ -f CHANGES.md ]; then
            git push --force origin "$BRANCH"
            gh pr create --base main --head "$BRANCH" --title "Ledger update for review" \
              --body-file CHANGES.md --label needs-review
          else
            echo "No changes today."
          fi
