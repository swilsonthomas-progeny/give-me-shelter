name: Feed check (temporary)
on: workflow_dispatch
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          import sys, urllib.request; sys.path.insert(0, "scripts")
          import update
          for u in [l.strip() for l in open("feeds.txt") if l.strip() and not l.startswith("#")]:
              try:
                  raw = urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": update.FEED_UA}), timeout=25).read()
                  print("OK  ", len(update.parse_feed(raw)), "items", u)
              except Exception as e:
                  print("FAIL", type(e).__name__, e, u)
          PY
