; Record player puck: Elecrow CrowPanel 2.1" rotary display
; (ESP32-S3R8: 16 MB flash, 8 MB octal PSRAM, 480x480 round RGB panel)
;
; Elecrow's examples need arduino-esp32 3.x, which the stock PlatformIO
; platform does not ship, so this uses the community pioarduino build.
[env:crowpanel21]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    moononournation/GFX Library for Arduino@^1.6.0
    bitbank2/JPEGDEC@^1.6.0
    bblanchon/ArduinoJson@^7.2.0
